name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Build (warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme SwiftXM -destination 'generic/platform=iOS' -quiet
